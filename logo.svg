<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" height="160" width="600">
  <defs>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D6A4F"/>
      <stop offset="100%" style="stop-color:#0F382E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FD0D4"/>
      <stop offset="100%" style="stop-color:#2bbfc4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Mountain Icon -->
  <g transform="translate(10, 10)">
    <!-- Background circle -->
    <circle cx="50" cy="50" r="48" fill="#0F382E"/>
    
    <!-- Mountain silhouette -->
    <path d="M12 85 L32 45 L45 65 L62 30 L82 55 L92 85 Z" 
          fill="url(#mountainGrad)" stroke="#3FD0D4" stroke-width="2"/>
    
    <!-- Snow cap -->
    <path d="M58 30 L62 20 L68 35 L62 30 L58 30" 
          fill="white" opacity="0.9"/>
    
    <!-- Small house -->
    <rect x="42" y="62" width="16" height="14" fill="#3FD0D4" rx="2"/>
    <polygon points="40,62 50,50 60,62" fill="#2D6A4F"/>
    <rect x="47" y="70" width="6" height="6" fill="#F8F5F0" rx="1"/>
    
    <!-- Sun/Glow -->
    <circle cx="20" cy="25" r="8" fill="#FFD166" opacity="0.6"/>
    <circle cx="20" cy="25" r="5" fill="#FFD166" opacity="0.9"/>
  </g>

  <!-- Text -->
  <g>
    <text x="110" y="52" font-family="'Poppins','Inter',sans-serif" font-weight="800" font-size="34" fill="#0F382E" letter-spacing="-0.5">
      KUNDASANG
    </text>
    <text x="110" y="82" font-family="'Poppins','Inter',sans-serif" font-weight="600" font-size="16" fill="#3FD0D4" letter-spacing="3">
      HOMESTAY
    </text>
    <text x="112" y="98" font-family="'Inter',sans-serif" font-weight="400" font-size="9" fill="#6B7280" letter-spacing="2">
      VERIFIED • MOUNTAIN STAYS
    </text>
  </g>

  <!-- Decorative line -->
  <line x1="110" y1="62" x2="300" y2="62" stroke="#3FD0D4" stroke-width="2" opacity="0.3"/>
</svg>