<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Dashboard - Kundasang Homestay</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="animations.css" />
  <style>
    /* ===== ROOT ===== */
    :root {
      --primary: #0F382E;
      --primary-light: #1a4d3e;
      --accent: #3FD0D4;
      --accent-hover: #2bbfc4;
      --accent-glow: rgba(63, 208, 212, 0.25);
      --bg: #F8F5F0;
      --card: #ffffff;
      --dark: #212121;
      --glass: rgba(255, 255, 255, 0.72);
      --shadow-sm: 0 2px 20px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 40px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
      --shadow-glow: 0 8px 30px rgba(63, 208, 212, 0.25);
    }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: hidden; }
    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .font-poppins { font-family: "Poppins", sans-serif; }
    .rounded-xl { border-radius: 16px !important; }
    .rounded-2xl { border-radius: 24px !important; }
    .rounded-full { border-radius: 999px !important; }
    .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0, 0, 0, 0.04);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      padding: 20px;
    }
    .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

    /* ===== FORM INPUTS (FIXED - MATCHES INDEX) ===== */
    .form-input {
      width: 100%;
      border: 2px solid #e2e8f0;
      border-radius: 999px;
      padding: 14px 20px;
      font-size: 14px;
      font-family: "Poppins", sans-serif;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      background: white;
      min-height: 52px;
      -webkit-appearance: none;
      appearance: none;
      color: #212121;
      outline: none;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
      transform: translateY(-1px);
    }
    .form-input::placeholder {
      color: #94a3b8;
    }

    /* ===== BUTTONS ===== */
    .btn-primary {
      background: var(--primary);
      color: white;
      border-radius: 999px;
      padding: 12px 24px;
      font-weight: 700;
      font-family: "Poppins", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(15, 56, 46, 0.3); }
    .btn-primary:hover::after { opacity: 1; }
    .btn-accent {
      background: var(--accent);
      color: white;
      border-radius: 999px;
      padding: 10px 20px;
      font-weight: 700;
      font-family: "Poppins", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-accent:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: var(--shadow-glow); }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #cbd5e1;
      color: #475569;
      border-radius: 999px;
      padding: 10px 20px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
      font-family: "Poppins", sans-serif;
    }
    .btn-outline:hover { background: #f1f5f9; border-color: #94a3b8; transform: translateY(-2px); }
    .btn-success {
      background: #16a34a;
      color: white;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      font-family: "Poppins", sans-serif;
    }
    .btn-success:hover { background: #15803d; }
    .btn-warning {
      background: #f59e0b;
      color: white;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      font-family: "Poppins", sans-serif;
    }
    .btn-warning:hover { background: #d97706; }
    .btn-danger {
      background: #dc2626;
      color: white;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      border: none;
      cursor: pointer;
      font-family: "Poppins", sans-serif;
    }
    .btn-danger:hover { background: #b91c1c; }
    .btn-whatsapp-sm {
      background: #25D366;
      color: white;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      font-family: "Poppins", sans-serif;
    }
    .btn-whatsapp-sm:hover { background: #1ebe5d; transform: translateY(-1px); }
    .refresh-btn {
      background: var(--accent);
      color: white;
      border-radius: 999px;
      padding: 8px 18px;
      border: none;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: "Poppins", sans-serif;
    }
    .refresh-btn:hover { background: var(--accent-hover); }
    .homestay-selector {
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      background: white;
      color: #1e293b;
    }
    .homestay-selector:focus { outline: none; border-color: var(--accent); }
    .guest-avatar {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }
    .setsail-nav-link {
      position: relative;
      font-family: "Poppins", sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: #212121;
      padding: 8px 0;
      cursor: pointer;
      background: none;
      border: none;
      text-decoration: none;
      transition: color 0.2s;
    }
    .setsail-nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0;
      height: 2.5px;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .setsail-nav-link:hover::after, .setsail-nav-link.active::after { width: 100%; }
    .setsail-nav-link:hover { color: var(--primary); }
    .setsail-nav-link.agent {
      color: #7c3aed;
      border: 1px solid #7c3aed;
      padding: 6px 16px;
      border-radius: 999px;
    }
    .setsail-nav-link.agent::after { display: none; }
    .setsail-nav-link.agent:hover { background: #7c3aed; color: white; }
    #mobileNav {
      position: fixed;
      top: 80px;
      left: 0;
      right: 0;
      z-index: 9999;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: var(--shadow-lg);
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateY(-10px);
      transition: max-height 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  opacity 0.4s ease,
                  transform 0.4s ease;
    }
    #mobileNav.open {
      max-height: 80vh;
      opacity: 1;
      overflow-y: auto;
      pointer-events: auto;
      transform: translateY(0);
    }
    #mobileNav a, #mobileNav button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 600;
      color: #212121;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      transition: background 0.2s, color 0.2s;
      background: transparent;
    }
    #mobileNav a:hover, #mobileNav button:hover { background: #f8f5f0; color: var(--accent); }
    #mobileNav .mobile-agent-link {
      color: #7c3aed !important;
      border: 1px solid #7c3aed !important;
      margin: 8px 16px;
      padding: 10px 16px !important;
      border-radius: 999px !important;
      width: auto !important;
      display: inline-block !important;
    }
    #mobileNav .mobile-agent-link:hover { background: #7c3aed !important; color: white !important; }
    #mobileNav .guest-btn {
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      text-align: center;
      border-radius: 999px;
      padding: 12px 24px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: 100%;
    }
    #mobileNav .guest-btn-primary { background: var(--accent); color: white; border: none; }
    #mobileNav .guest-btn:hover { background: var(--accent); color: white; }
    #mobileNav .guest-btn-primary:hover { background: var(--accent-hover); }
    #mobileNav .profile-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    #mobileNav .profile-card .avatar {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      flex-shrink: 0;
    }
    #mobileNav .profile-card .info { flex: 1; min-width: 0; overflow: hidden; }
    #mobileNav .profile-card .name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #mobileNav .profile-card .sub { font-size: 10px; color: rgba(255,255,255,0.6); }
    #mobileNav .profile-card .logout-btn {
      width: auto !important;
      display: inline-block !important;
      flex-shrink: 0;
      font-size: 10px;
      background: rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }
    #mobileNav .profile-card .logout-btn:hover { background: rgba(255,255,255,0.25); }
    #mobileNav .my-bookings-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #212121;
      color: white;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 16px;
      border-radius: 12px;
      transition: background 0.2s;
    }
    #mobileNav .my-bookings-btn:hover { background: #333; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: white;
      max-width: 480px;
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      animation: modalIn 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      padding: 20px 24px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { font-family: "Poppins", sans-serif; font-weight: 700; font-size: 20px; color: #212121; margin: 0; }
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      color: #9ca3af;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: color 0.2s;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { color: #212121; background: #f1f5f9; }
    .modal-body { padding: 16px 24px 20px 24px; font-size: 14px; line-height: 1.7; color: #4b5563; }
    .modal-footer {
      padding: 12px 24px 20px 24px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      border-top: 1px solid #f1f5f9;
    }
    .modal-footer .btn {
      padding: 10px 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-family: "Poppins", sans-serif;
    }
    .modal-footer .btn-primary { background: var(--primary); color: white; }
    .modal-footer .btn-primary:hover { background: var(--primary-light); }
    .modal-footer .btn-secondary { background: #f1f5f9; color: #475569; }
    .modal-footer .btn-secondary:hover { background: #e2e8f0; }

    /* ===== LOGIN SECTION STYLING ===== */
    #loginSection .form-input {
      width: 100%;
      border: 2px solid #e2e8f0;
      border-radius: 999px;
      padding: 14px 20px;
      font-size: 14px;
      font-family: "Poppins", sans-serif;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      background: white;
      min-height: 52px;
      -webkit-appearance: none;
      appearance: none;
      color: #212121;
      outline: none;
    }
    #loginSection .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
      transform: translateY(-1px);
    }
    #loginSection .form-input::placeholder {
      color: #94a3b8;
    }

    @media (max-width: 768px) {
      #desktopNav { display: none !important; }
      #mobileMenuBtn { display: flex !important; }
    }
    @media (max-width: 480px) {
      .btn-primary, .btn-accent, .btn-outline, .btn-success, .btn-warning, .btn-danger, .btn-whatsapp-sm { padding: 8px 14px; font-size: 10px; }
      #loginSection .form-input { min-height: 44px; padding: 10px 16px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <!-- ... rest of the body content remains the same ... -->
</body>
</html>
