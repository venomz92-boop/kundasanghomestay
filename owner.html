<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Dashboard - Kundasang Homestays</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #F8F5F0; }
    .sharp { border-radius: 2px; }
    .card { background: white; border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 2px 20px rgba(0,0,0,0.05); }
    .btn-primary { background: #0F382E; color: white; padding: 10px 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; }
    .btn-success { background: #16a34a; color: white; padding: 8px 16px; font-weight: 600; text-transform: uppercase; font-size: 11px; }
    .btn-warning { background: #f59e0b; color: white; padding: 8px 16px; font-weight: 600; text-transform: uppercase; font-size: 11px; }
    .btn-danger { background: #dc2626; color: white; padding: 8px 16px; font-weight: 600; text-transform: uppercase; font-size: 11px; }
    .btn-outline { background: transparent; border: 1px solid #d1d5db; padding: 8px 16px; font-weight: 600; font-size: 11px; }
  </style>
</head>
<body>
  <header class="bg-white shadow-sm p-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-[38px] h-[38px] rounded-full bg-[#3FD0D4] flex items-center justify-center text-white font-800 text-[20px]">K</div>
      <div class="font-800 text-[20px] text-[#212121]">KUNDASANG HOMESTAY<span class="text-sm font-normal text-zinc-500">• Owner Panel</span></div>
    </div>
    <div id="ownerNav" class="hidden">
      <span id="ownerNameDisplay" class="text-sm font-semibold mr-4"></span>
      <button onclick="logoutOwner()" class="text-xs bg-red-100 text-red-700 px-4 py-2 sharp">Logout</button>
    </div>
  </header>

  <div class="max-w-5xl mx-auto p-6">
    <!-- LOGIN FORM -->
    <div id="loginSection" class="max-w-md mx-auto card p-8 mt-10">
      <h2 class="text-2xl font-bold">Owner Login</h2>
      <p class="text-xs text-zinc-500 mt-1">Login with your Registered WhatsApp number</p>
      <input id="ownerWhatsapp" type="tel" placeholder="6012-3456789" class="w-full border sharp px-4 py-3 mt-4" />
      <input id="ownerPassword" type="password" placeholder="Password" class="w-full border sharp px-4 py-3 mt-3" />
      
      <div class="text-right mt-2">
        <button onclick="openOwnerForgotPassword()" class="text-[11px] text-purple-600 hover:underline">Forgot Password?</button>
      </div>
      
      <button onclick="ownerLogin()" class="btn-primary w-full mt-4 py-3">Login</button>
      <div id="loginError" class="text-red-600 text-xs mt-2 hidden"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardSection" class="hidden">
      <h2 class="text-2xl font-bold mb-2">Welcome, <span id="welcomeName"></span>!</h2>
      <p class="text-sm text-zinc-500">Your homestay: <span id="homestayNameDisplay" class="font-semibold"></span></p>

      <div class="grid md:grid-cols-2 gap-6 mt-6">
        <div class="card p-6 md:col-span-2">
          <h3 class="font-bold text-lg">📅 Your Bookings</h3>
          <div id="ownerBookingsList" class="mt-4 space-y-4">
            <div class="text-sm text-zinc-400">Loading bookings...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "/api";
    let ownerToken = sessionStorage.getItem('kd_owner_token') || '';
    let ownerHomestayId = null;

    // =============================================
    // OWNER FORGOT PASSWORD
    // =============================================
    function openOwnerForgotPassword() {
      const email = prompt('Enter your registered email address to reset your owner password:');
      if (email && email.trim()) {
        const statusEl = document.getElementById('loginError');
        statusEl.textContent = 'Sending reset link...';
        statusEl.className = 'text-blue-600 text-xs mt-2';
        statusEl.classList.remove('hidden');

        fetch(API_BASE + '/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.trim(), userType: 'owner' })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert(data.message || 'If an account exists, a reset link has been sent to your email.');
            statusEl.classList.add('hidden');
          } else {
            alert(data.error || 'Request failed. Please try again.');
            statusEl.classList.add('hidden');
          }
        })
        .catch(() => {
          alert('Network error. Please try again.');
          statusEl.classList.add('hidden');
        });
      }
    }

    // =============================================
    // OWNER LOGIN
    // =============================================
    async function ownerLogin() {
      const whatsapp = document.getElementById('ownerWhatsapp').value.replace(/[^0-9]/g, '');
      const password = document.getElementById('ownerPassword').value;
      const errorEl = document.getElementById('loginError');
      errorEl.classList.add('hidden');

      if (!whatsapp || !password) { alert("Fill all fields"); return; }

      try {
        const res = await fetch(API_BASE + '/owner-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ whatsapp, password })
        });
        const data = await res.json();
        if (data.success) {
          ownerToken = data.token;
          sessionStorage.setItem('kd_owner_token', ownerToken);
          ownerHomestayId = data.homestay.id;
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('dashboardSection').classList.remove('hidden');
          document.getElementById('ownerNav').classList.remove('hidden');
          document.getElementById('welcomeName').innerText = data.homestay.ownerName;
          document.getElementById('homestayNameDisplay').innerText = data.homestay.name;
          document.getElementById('ownerNameDisplay').innerText = data.homestay.ownerName;
          loadBookings();
        } else {
          errorEl.innerText = data.error || "Login failed";
          errorEl.className = 'text-red-600 text-xs mt-2';
          errorEl.classList.remove('hidden');
        }
      } catch(e) {
        alert("Network error: " + e.message);
      }
    }

    // =============================================
    // LOAD BOOKINGS
    // =============================================
    async function loadBookings() {
      if (!ownerToken) return;
      const listDiv = document.getElementById('ownerBookingsList');
      listDiv.innerHTML = '<div class="text-sm text-zinc-400">Loading...</div>';

      try {
        const res = await fetch(API_BASE + '/owner-bookings', {
          headers: { 'Owner-Authorization': 'Bearer ' + ownerToken }
        });
        if (!res.ok) throw new Error('Failed to fetch');
        const bookings = await res.json();

        if (bookings.length === 0) {
          listDiv.innerHTML = '<div class="text-sm text-zinc-500">No upcoming bookings.</div>';
          return;
        }

        listDiv.innerHTML = bookings.map(b => {
          const isPaid = b.status && b.status.toLowerCase().includes('paid');
          const isCompleted = b.payoutDate || (b.status && b.status.toLowerCase().includes('completed'));
          const isPending = b.status && b.status.toLowerCase().includes('pending');
          
          let statusBadge = '';
          if (isCompleted) {
            statusBadge = '<span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full">✅ Completed</span>';
          } else if (isPaid) {
            statusBadge = '<span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full">🟡 Paid - Ready for Check-in</span>';
          } else if (isPending) {
            statusBadge = '<span class="text-xs bg-red-100 text-red-800 px-2 py-1 rounded-full">⏳ Pending Payment</span>';
          } else {
            statusBadge = `<span class="text-xs bg-gray-100 text-gray-800 px-2 py-1 rounded-full">${b.status || 'Unknown'}</span>`;
          }

          let actionButtons = '';
          if (isPaid && !isCompleted) {
            actionButtons += `
              <button onclick="confirmCheckIn('${b.id}')" class="btn-success sharp">✅ Confirm Check-in</button>
            `;
          }
          if (!isCompleted) {
            actionButtons += `
              <button onclick="changeBookingDates('${b.id}')" class="btn-warning sharp">📅 Change Dates</button>
            `;
          }
          if (isCompleted) {
            actionButtons = `<span class="text-xs text-zinc-400">✅ Paid out on ${b.payoutDate ? new Date(b.payoutDate).toLocaleDateString('en-MY') : 'N/A'}</span>`;
          }

          return `
            <div class="border p-4 sharp flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
              <div class="flex-1">
                <div class="font-bold text-sm">${b.homestay}</div>
                <div class="text-xs text-zinc-500">${b.checkin} → ${b.checkout} • ${b.nights || '?'} nights • Guest: ${b.guestName || b.guestEmail}</div>
                <div class="text-xs font-semibold mt-1">Base: RM${b.base} • Total Paid: RM${b.total}</div>
                <div class="mt-1">${statusBadge}</div>
              </div>
              <div class="flex flex-wrap gap-2 mt-2 md:mt-0">
                ${actionButtons}
              </div>
            </div>
          `;
        }).join('');
      } catch(e) {
        listDiv.innerHTML = '<div class="text-sm text-red-600">Error loading bookings.</div>';
        console.error(e);
      }
    }

    // =============================================
    // CONFIRM CHECK-IN (Owner triggers payout)
    // =============================================
    async function confirmCheckIn(bookingId) {
      if (!confirm(`Confirm check-in for booking ${bookingId}?\n\nYou will receive your payment at your bank account via ToyyibPay in 1-4 business day.`)) return;
      
      try {
        const res = await fetch(API_BASE + '/owner-update-booking', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Owner-Authorization': 'Bearer ' + ownerToken
          },
          body: JSON.stringify({ 
            bookingId, 
            action: 'confirmCheckin' 
          })
        });
        const data = await res.json();
        if (data.success) {
          alert('✅ ' + data.message);
          loadBookings();
        } else {
          alert('❌ Failed: ' + (data.error || data.message));
        }
      } catch(e) {
        alert('Network error: ' + e.message);
      }
    }

    // =============================================
    // CHANGE BOOKING DATES
    // =============================================
    async function changeBookingDates(bookingId) {
      // First, get current booking info from the DOM or fetch it
      const currentCheckin = prompt('Enter new check-in date (YYYY-MM-DD):', '');
      if (!currentCheckin) return;
      const currentCheckout = prompt('Enter new check-out date (YYYY-MM-DD):', '');
      if (!currentCheckout) return;

      const d1 = new Date(currentCheckin);
      const d2 = new Date(currentCheckout);
      if (isNaN(d1) || isNaN(d2) || d1 >= d2) {
        alert('Invalid dates. Check-out must be after check-in.');
        return;
      }

      if (!confirm(`Change booking ${bookingId} dates to ${currentCheckin} → ${currentCheckout}?`)) return;

      try {
        const res = await fetch(API_BASE + '/owner-update-booking', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Owner-Authorization': 'Bearer ' + ownerToken
          },
          body: JSON.stringify({ 
            bookingId, 
            action: 'changeDates',
            checkin: currentCheckin,
            checkout: currentCheckout
          })
        });
        const data = await res.json();
        if (data.success) {
          alert('✅ ' + data.message);
          loadBookings();
        } else {
          alert('❌ Failed: ' + (data.error || data.message));
        }
      } catch(e) {
        alert('Network error: ' + e.message);
      }
    }

    // =============================================
    // LOGOUT
    // =============================================
    function logoutOwner() {
      sessionStorage.removeItem('kd_owner_token');
      ownerToken = '';
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('ownerNav').classList.add('hidden');
    }

    // =============================================
    // INIT
    // =============================================
    (function init() {
      const token = sessionStorage.getItem('kd_owner_token');
      if (token) {
        ownerToken = token;
        try {
          const data = JSON.parse(atob(token));
          ownerHomestayId = data.ownerId;
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('dashboardSection').classList.remove('hidden');
          document.getElementById('ownerNav').classList.remove('hidden');
          document.getElementById('welcomeName').innerText = data.ownerName || 'Owner';
          document.getElementById('homestayNameDisplay').innerText = 'Your Homestay';
          document.getElementById('ownerNameDisplay').innerText = data.ownerName || 'Owner';
          loadBookings();
        } catch(e) { logoutOwner(); }
      }
    })();
  </script>
</body>
</html>
