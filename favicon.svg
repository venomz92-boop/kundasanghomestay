<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- Background Rounded Shape -->
  <rect x="150" y="150" width="700" height="700" rx="350" fill="#174f43" />

  <!-- Main Central Mountain Outline -->
  <path d="M 230,650 L 500,260 L 770,650" fill="none" stroke="#f4ead6" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 370,600 L 500,390 L 630,600" fill="none" stroke="#f4ead6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Back Left Mountain -->
  <path d="M 190,560 L 310,370 L 370,500 L 410,470 L 470,600 Z" fill="#f4ead6" />

  <!-- Back Right Mountain -->
  <path d="M 550,540 L 680,320 L 810,540 Z" fill="#f4ead6" />

  <!-- House Structure -->
  <!-- Roof -->
  <path d="M 400,650 L 500,550 L 600,650" fill="#f4ead6" stroke="#f4ead6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- House Body -->
  <path d="M 420,660 L 580,660 L 580,780 L 420,780 Z" fill="#f4ead6" />
  <!-- Door -->
  <path d="M 480,720 L 520,720 L 520,780 L 480,780 Z" fill="#174f43" />

  <!-- Window and Glow -->
  <!-- Window Frame -->
  <rect x="460" y="640" width="80" height="80" fill="#174f43" />
  <!-- Window Glow Center -->
  <rect x="475" y="655" width="50" height="50" fill="#fffeb9" />
  <!-- Glow Rays -->
  <g stroke="#fffeb9" stroke-width="4" stroke-linecap="round">
    <line x1="500" y1="600" x2="500" y2="630" />
    <line x1="500" y1="690" x2="500" y2="720" />
    <line x1="420" y1="680" x2="450" y2="680" />
    <line x1="550" y1="680" x2="580" y2="680" />
    <line x1="440" y1="620" x2="460" y2="640" />
    <line x1="540" y1="620" x2="560" y2="640" />
    <line x1="440" y1="740" x2="460" y2="720" />
    <line x1="540" y1="740" x2="560" y2="720" />
  </g>

  <!-- Trees -->
  <!-- Left Tree -->
  <g fill="#f4ead6">
    <path d="M 330,780 L 380,650 L 430,780 Z" />
    <path d="M 345,720 L 380,610 L 415,720 Z" />
    <path d="M 360,780 L 380,670 L 400,780 Z" />
    <!-- Trunk -->
    <rect x="375" y="780" width="10" height="20" />
  </g>

  <!-- Right Tree -->
  <g fill="#f4ead6">
    <path d="M 570,780 L 620,650 L 670,780 Z" />
    <path d="M 585,720 L 620,610 L 655,720 Z" />
    <path d="M 600,780 L 620,670 L 640,780 Z" />
    <!-- Trunk -->
    <rect x="615" y="780" width="10" height="20" />
  </g>

  <!-- Ground Line -->
  <line x1="350" y1="790" x2="650" y2="790" stroke="#f4ead6" stroke-width="12" stroke-linecap="round" />

</svg>
