<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin:0; }
    .box { background: white; padding: 30px; border-radius: 12px; max-width: 400px; width:100%; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { font-size: 24px; }
    input { width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; }
    button { width:100%; padding:12px; background:#0F382E; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
    .error { color:red; }
    .success { color:green; }
  </style>
</head>
<body>
<div class="box">
  <h1>Reset Password</h1>
  <p id="status"></p>
  <form id="resetForm">
    <input type="password" id="password" placeholder="New password" required minlength="6">
    <input type="password" id="confirm" placeholder="Confirm password" required>
    <button type="submit">Reset Password</button>
  </form>
  <p style="margin-top:12px;text-align:center;"><a href="/login.html">Back to Login</a></p>
</div>
<script>

  function safeHTML(html) {
  if (!html) return '';
  return DOMPurify.sanitize(html, {
    ALLOWED_TAGS: [
      'div', 'span', 'p', 'a', 'br', 'b', 'i', 'u', 'strong', 'em',
      'h1','h2','h3','h4','h5','h6','ul','ol','li','table','tr','td','th',
      'button','input','form','label','select','option','textarea',
      'section','article','header','footer','nav','main','aside',
      'code','pre','blockquote','hr','small','sub','sup','svg','path',
      'img'
    ],
    ALLOWED_ATTR: [
      'id','class','style','href','src','alt','title','rel','target',
      'onclick','onchange','oninput','onload','onerror',
      'method','action','type','name','value','placeholder',
      'checked','disabled','readonly','required','multiple',
      'min','max','step','pattern','autocomplete','inputmode',
      'viewBox','fill','stroke','stroke-width','d'
    ],
    ALLOW_DATA_ATTR: false,
    FORCE_HTTPS: true
  });
}
  
  document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const pwd = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const status = document.getElementById('status');
    status.className = '';
    if (pwd.length < 6) { status.textContent = 'Password must be at least 6 characters.'; status.className='error'; return; }
    if (pwd !== confirm) { status.textContent = 'Passwords do not match.'; status.className='error'; return; }
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) { status.textContent = 'Missing reset token.'; status.className='error'; return; }
    try {
      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pwd })
      });
      const data = await res.json();
      if (data.success) {
        status.textContent = '✅ Password reset successful! Redirecting...';
        status.className = 'success';
        setTimeout(() => window.location.href = '/login.html', 3000);
      } else {
        status.textContent = data.error || 'Reset failed.';
        status.className = 'error';
      }
    } catch(e) {
      status.textContent = 'Network error. Please try again.';
      status.className = 'error';
    }
  });
  // Check token presence
  if (!new URLSearchParams(window.location.search).get('token')) {
    document.getElementById('status').textContent = 'Invalid or missing reset token.';
    document.getElementById('status').className = 'error';
    document.getElementById('resetForm').style.display = 'none';
  }
</script>
</body>
</html>
