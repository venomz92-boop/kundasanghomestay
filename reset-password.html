<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Kundasang Homestay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #F8F5F0; }
    .sharp { border-radius: 2px; }
    .card { background: white; border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 2px 20px rgba(0,0,0,0.05); }
    .btn-primary { background: #0F382E; color: white; padding: 12px 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto px-4 py-16">
    <div class="card p-8">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-[38px] h-[38px] rounded-full bg-[#3FD0D4] flex items-center justify-center text-white font-800 text-[20px]">K</div>
        <div class="font-800 text-[20px] text-[#212121]">KUNDASANG <span class="text-sm font-normal text-zinc-500">• Reset Password</span></div>
      </div>

      <div id="statusMessage" class="hidden p-3 rounded-xl text-xs mb-4"></div>

      <div id="resetForm">
        <p class="text-sm text-zinc-600 mb-4">Enter your new password below.</p>
        <input id="newPassword" type="password" placeholder="New password (min 6 chars)" class="w-full border sharp px-4 py-3 mt-2" />
        <input id="confirmPassword" type="password" placeholder="Confirm password" class="w-full border sharp px-4 py-3 mt-3" />
        <button onclick="resetPassword()" class="btn-primary w-full mt-4 py-3">Reset Password</button>
      </div>

      <div id="successMessage" class="hidden text-center">
        <div class="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">✓</div>
        <h3 class="text-xl font-bold">Password Reset!</h3>
        <p class="text-sm text-zinc-600 mt-2">Your password has been updated. You can now log in.</p>
        <a href="/" class="inline-block mt-4 text-[#3FD0D4] underline">Back to Home</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "/api";

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const userType = urlParams.get('type') || 'guest';

    if (!token) {
      document.getElementById('resetForm').innerHTML = '<p class="text-red-600">Invalid reset link. Please request a new one.</p>';
    }

    async function resetPassword() {
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const statusEl = document.getElementById('statusMessage');

      if (password.length < 6) {
        showStatus('Password must be at least 6 characters.', 'error');
        return;
      }

      if (password !== confirm) {
        showStatus('Passwords do not match.', 'error');
        return;
      }

      try {
        const res = await fetch(API_BASE + '/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, userType })
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('resetForm').classList.add('hidden');
          document.getElementById('successMessage').classList.remove('hidden');
        } else {
          showStatus(data.error || 'Reset failed. Please try again.', 'error');
        }
      } catch(e) {
        showStatus('Network error: ' + e.message, 'error');
      }
    }

    function showStatus(message, type) {
      const el = document.getElementById('statusMessage');
      el.textContent = message;
      el.className = 'p-3 rounded-xl text-xs mb-4 ' + (type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200');
      el.classList.remove('hidden');
    }
  </script>
</body>
</html>
