<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Reset Password - Kundasang Homestay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Satisfy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="animations.css" />
  <style>
    :root {
      --primary: #0F382E;
      --primary-light: #1a4d3e;
      --accent: #3FD0D4;
      --accent-hover: #2bbfc4;
      --bg: #F8F5F0;
      --card: #ffffff;
      --dark: #212121;
    }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .font-poppins { font-family: "Poppins", sans-serif; }
    .font-satisfy { font-family: "Satisfy", cursive; }
    .card {
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.04);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .btn-primary {
      background: var(--primary);
      color: white;
      border-radius: 999px;
      padding: 14px 28px;
      font-weight: 700;
      font-family: "Poppins", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); }
    .form-input {
      width: 100%;
      border: 2px solid #e2e8f0;
      border-radius: 999px;
      padding: 14px 20px;
      font-size: 14px;
      font-family: "Poppins", sans-serif;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      background: white;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(63, 208, 212, 0.25);
    }
  </style>
</head>
<body>

<!-- ===== MAIN CONTENT ===== -->
<main class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-[440px] animate-on-scroll">
    <div class="text-center mb-10">
      <div class="font-satisfy text-[#3FD0D4] text-[32px] leading-none">Reset Password</div>
      <h1 class="font-poppins font-700 text-[34px] md:text-[40px] text-[#212121] tracking-[-0.5px] mt-1">Create New Password</h1>
      <div class="w-[40px] h-[3px] bg-gradient-to-r from-[#3FD0D4] to-[#0F382E] mx-auto mt-3 rounded-full"></div>
      <p class="text-[13px] text-[#212121]/60 mt-3">Enter your new password below.</p>
    </div>

    <div class="card p-8 md:p-10">
      <div id="resetError" class="hidden p-4 rounded-xl text-xs bg-red-50 text-red-700 border border-red-200 mb-5"></div>
      <div id="resetSuccess" class="hidden p-4 rounded-xl text-xs bg-green-50 text-green-700 border border-green-200 mb-5"></div>

      <form id="resetForm" onsubmit="handleReset(event)" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-[#212121] block mb-1.5">New Password *</label>
          <input id="resetPassword" type="password" placeholder="Min 6 characters" class="form-input" required minlength="6" />
          <p class="text-[10px] text-[#212121]/40 mt-1.5">Minimum 6 characters</p>
        </div>
        <div>
          <label class="text-xs font-semibold text-[#212121] block mb-1.5">Confirm Password *</label>
          <input id="resetConfirm" type="password" placeholder="Re-enter password" class="form-input" required minlength="6" />
        </div>
        <button type="submit" class="btn-primary py-4 mt-3 text-sm tracking-widest">Reset Password</button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-[13px] text-[#212121]/60"><a href="/login.html" class="text-[#3FD0D4] font-semibold hover:underline transition-colors">Back to Login</a></p>
      </div>
    </div>
  </div>
</main>

<script>
// =============================================================
// RESET PASSWORD HANDLER
// =============================================================
const API_BASE = "/api";

async function handleReset(e) {
  e.preventDefault();
  
  const password = document.getElementById('resetPassword').value.trim();
  const confirm = document.getElementById('resetConfirm').value.trim();
  const errorEl = document.getElementById('resetError');
  const successEl = document.getElementById('resetSuccess');
  
  errorEl.classList.add('hidden');
  successEl.classList.add('hidden');

  if (!password || !confirm) {
    errorEl.textContent = 'Please fill in both fields.';
    errorEl.classList.remove('hidden');
    return;
  }

  if (password.length < 6) {
    errorEl.textContent = 'Password must be at least 6 characters.';
    errorEl.classList.remove('hidden');
    return;
  }

  if (password !== confirm) {
    errorEl.textContent = 'Passwords do not match.';
    errorEl.classList.remove('hidden');
    return;
  }

  // Get token and type from URL
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const userType = urlParams.get('type');

  if (!token || !userType) {
    errorEl.textContent = 'Invalid or missing reset token. Please request a new password reset link.';
    errorEl.classList.remove('hidden');
    return;
  }

  try {
    const res = await fetch(API_BASE + '/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password, userType })
    });
    const data = await res.json();

    if (data.success) {
      successEl.textContent = '✓ Password reset successful! You can now log in with your new password.';
      successEl.classList.remove('hidden');
      document.getElementById('resetForm').classList.add('hidden');
      
      // Redirect to login after 3 seconds
      setTimeout(() => {
        window.location.href = '/login.html';
      }, 3000);
    } else {
      errorEl.textContent = data.error || 'Failed to reset password. Please try again.';
      errorEl.classList.remove('hidden');
    }
  } catch(e) {
    errorEl.textContent = 'Network error: ' + e.message;
    errorEl.classList.remove('hidden');
  }
}

// =============================================================
// CHECK TOKEN ON LOAD
// =============================================================
document.addEventListener('DOMContentLoaded', function() {
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const userType = urlParams.get('type');
  
  if (!token || !userType) {
    document.getElementById('resetError').textContent = 'Invalid or missing reset token. Please request a new password reset link.';
    document.getElementById('resetError').classList.remove('hidden');
    document.getElementById('resetForm').classList.add('hidden');
  }
});
</script>
</body>
</html>
